name: Docker (Public MCP)

on:
  push:
    # Only a change to the public MCP rebuilds it: its submodule is cloned
    # from FINKI's GitLab, which the runners cannot always reach.
    paths:
      - public-mcp
      - .gitmodules
      - .github/workflows/docker-public-mcp.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    uses: finki-hub/.github/.github/workflows/docker.yaml@main
    with:
      dockerfile: ./public-mcp/Dockerfile
      context: ./public-mcp
      package-name: mcp-public
      submodules: true
    secrets: inherit
