[project]
name = "local-mcp"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "cyrtranslit>=1.2.0",
  "httpx>=0.28.1",
  "ijson>=3.5.0",
  "mcp[cli]>=2.0.0",
  "posthog>=7.35.4",
  "pydantic-settings>=2.14.2",
  "thefuzz>=0.22.1",
]

[dependency-groups]
dev = ["mypy>=2.3.0", "ruff>=0.16.1"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "N",
  "UP",
  "YTT",
  "ANN",
  "ASYNC",
  "S",
  "B",
  "COM",
  "C4",
  "DTZ",
  "FA",
  "ISC",
  "ICN",
  "G",
  "INP",
  "PIE",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "TID",
  "PTH",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  "PERF",
  "FURB",
  "LOG",
  "RUF",
]
ignore = [
  "COM812",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "TRY003",
  "PLR0911",
  "RET504",
  "RUF001",
  "RUF002",
  "RUF003",
  "E501",
  "PLR0913",
]
